<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Prelapse</title>
<meta name="description" content="A kind, private habit tracker that helps you spot tricky days before they happen.">
<meta name="theme-color" content="#2F4F45">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icon.svg">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Prelapse">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;800&display=swap">
<style>
/* Layout: one phone-width column, illustrated bush header over a deep panel, tab bar pinned to the bottom. */
:root {
  --page: #F5EFE3; --card: #FFFDF8; --ink: #1E302B; --muted: #56675F; --line: #E6DDCB; --tint: #E8EFE4;
  --panel: #2F4F45; --panel-ink: #F5EFE3; --panel-muted: #B9CBBF; --glass: rgba(245,239,227,0.1);
  --deep: #4C7864; --on-deep: #FFFFFF; --wattle: #F2C462; --on-wattle: #1E302B; --ochre: #D9893B; --sage: #A9C2A1;
  --euc: #5E8C76; --terra: #B95B3A; --tab: #263F38; --plus: #FBEBC4; --overlay: rgba(20,40,36,0.5);
  --font: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --page: #142824; --card: #1B332E; --ink: #F5EFE3; --muted: #B9CBBF; --line: #2A453E; --tint: #22403A;
  --panel: #1B332E; --panel-ink: #F5EFE3; --panel-muted: #B9CBBF; --glass: rgba(245,239,227,0.08);
  --tab: #12241F; --plus: #4A4224; color-scheme: dark } }
:root[data-theme="dark"] {
  --page: #142824; --card: #1B332E; --ink: #F5EFE3; --muted: #B9CBBF; --line: #2A453E; --tint: #22403A;
  --panel: #1B332E; --panel-ink: #F5EFE3; --panel-muted: #B9CBBF; --glass: rgba(245,239,227,0.08);
  --tab: #12241F; --plus: #4A4224; color-scheme: dark }
.app.day { --page: #F5EFE3; --card: #FFFDF8; --ink: #1E302B; --muted: #56675F; --line: #E6DDCB; --tint: #E8EFE4;
  --panel: #2F4F45; --glass: rgba(245,239,227,0.1); --tab: #263F38; --plus: #FBEBC4; color-scheme: light }
.app.night { --page: #142824; --card: #1B332E; --ink: #F5EFE3; --muted: #B9CBBF; --line: #2A453E; --tint: #22403A;
  --panel: #1B332E; --glass: rgba(245,239,227,0.08); --tab: #12241F; --plus: #4A4224; color-scheme: dark }

html, body { height: 100%; margin: 0; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; touch-action: manipulation; overflow-x: hidden; }
body { overflow-anchor: none; overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; }
button, a, .seg button { -webkit-user-select: none; user-select: none; touch-action: manipulation; }
body { background: var(--page); color: var(--ink); font-family: var(--font); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea, select { font: inherit; color: var(--ink); }
:focus-visible { outline: 3px solid var(--wattle); outline-offset: 2px; border-radius: 8px; }
a { color: inherit; }

.app { max-width: 480px; margin: 0 auto; min-height: 100%; background: var(--page); color: var(--ink); position: relative; padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
.app.stacked { padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px)); }

.app.todaypage { background: var(--panel); }
.wrap { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.col { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 8px; align-items: center; }
.wrapflex { display: flex; flex-wrap: wrap; gap: 8px; }
.grow { flex: 1; min-width: 0; }

.demo-bar { font-size: 12px; text-align: center; color: var(--muted); padding-block: 6px; background: var(--tint); }
.demo-bar b { color: var(--ink); }

h1, h2, h3 { margin: 0; text-wrap: balance; }
.hero { font-size: 30px; font-weight: 800; letter-spacing: -0.6px; line-height: 1.12; }
.title { font-size: 22px; font-weight: 800; letter-spacing: -0.3px; line-height: 1.2; }
.heading { font-size: 17px; font-weight: 800; }
.small { font-size: 13px; color: var(--muted); }
.tiny { font-size: 12px; color: var(--muted); }
.label { font-size: 12px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; color: var(--muted); }
.num { font-variant-numeric: tabular-nums; }

.btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 52px; border-radius: 18px; font-weight: 800; font-size: 16px; padding: 0 16px; text-align: center; }
.btn-deep { background: var(--deep); color: var(--on-deep); }
.btn-wattle { background: var(--wattle); color: var(--on-wattle); }
.btn-outline { border: 2px solid var(--sage); color: var(--ink); }
.panel .btn-outline, .dark .btn-outline { color: var(--panel-ink); border-color: rgba(185,203,191,0.5); }
.btn-text { min-height: 44px; color: var(--deep); font-weight: 800; }
.night .btn-text, .dark .btn-text, .panel .btn-text { color: var(--sage); }
.btn-sm { min-height: 40px; font-size: 14px; border-radius: 14px; width: auto; padding: 0 14px; }

.chip { display: inline-flex; align-items: center; min-height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); font-weight: 600; font-size: 14px; }
.chip.on { background: var(--panel); color: var(--panel-ink); border-color: var(--panel); }
.night .chip.on { background: var(--deep); border-color: var(--deep); }
.seg { display: flex; gap: 6px; }
.seg button { flex: 1; min-height: 44px; border-radius: 12px; background: var(--tint); font-weight: 600; font-size: 13px; padding: 0 4px; }
.seg button.on { background: var(--panel); color: var(--wattle); font-weight: 800; }
.night .seg button.on { background: var(--deep); color: #FFFFFF; }

.card { background: var(--card); border-radius: 20px; padding: 16px; }
.card.line { border: 1px solid var(--line); }
.tag { display: inline-flex; align-items: center; font-weight: 800; font-size: 12px; padding: 5px 10px; border-radius: 999px; white-space: nowrap; }
.risk-low { background: var(--sage); color: #1E302B; }
.risk-med { background: var(--ochre); color: #1E302B; }
.risk-high { background: var(--terra); color: #FFFFFF; }
.edge-low { border-left: 6px solid var(--sage); }
.edge-med { border-left: 6px solid var(--ochre); }
.edge-high { border-left: 6px solid var(--terra); }
.plus { background: var(--plus); color: var(--ink); font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 6px; letter-spacing: 0.5px; }

.field { width: 100%; background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 16px; min-height: 48px; }
input[type="date"].field { -webkit-appearance: none; appearance: none; display: block; text-align: left; }
input[type="date"].field::-webkit-date-and-time-value { text-align: left; }
.panel .field { background: rgba(245,239,227,0.1); border-color: rgba(185,203,191,0.35); color: var(--panel-ink); }
.panel .field::placeholder { color: var(--panel-muted); }
.field:focus { border-color: var(--deep); outline: none; }
textarea.field { min-height: 84px; resize: vertical; }

/* Scene + panel */
.scene { position: relative; height: 300px; overflow: hidden; }
.scene svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.scene .greet { position: absolute; left: max(20px, env(safe-area-inset-left, 0px)); right: 20px; top: 28px; }
.scene .greet .hero { font-size: 32px; }
.scene.dusk .greet, .scene.nightsky .greet { color: #F5EFE3; }
.scene .greet .sub { font-size: 15px; opacity: 0.85; }
.panel { background: var(--panel); color: var(--panel-ink); border-radius: 30px 30px 0 0; margin-top: -40px; position: relative; padding-top: 20px; padding-bottom: 20px; min-height: 60vh; }
.panel .small, .panel .tiny, .panel .label, .dark .small, .dark .tiny, .dark .label { color: var(--panel-muted); }
.glass { background: var(--glass); border-radius: 18px; padding: 14px; }

.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tiles.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.tile { border-radius: 16px; padding: 12px; background: var(--card); min-width: 0; }
.panel .tile, .dark .tile { background: var(--glass); }
.tile .v { font-size: 24px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.tile .k { font-size: 12px; color: var(--muted); }
.panel .tile .k, .dark .tile .k { color: var(--panel-muted); }
.tile .v.gold { color: var(--wattle); }
.tile .v.deep { color: var(--deep); }
.night .tile .v.deep { color: var(--sage); }

.habit-card { display: flex; gap: 12px; align-items: center; width: 100%; text-align: left; background: var(--glass); border-radius: 18px; padding: 12px 14px; }
.hicon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; background: var(--tint); color: var(--panel); }
.panel .hicon { background: rgba(245,239,227,0.14); color: var(--panel-ink); }
.night .hicon { color: var(--panel-ink); }

/* Top bar for stacked screens */
.topbar { display: flex; align-items: center; justify-content: space-between; min-height: 56px; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--page); z-index: 5; }
.topbar .t { font-weight: 800; font-size: 16px; }
.iconbtn { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; border-radius: 12px; }
.dark { background: var(--panel); color: var(--panel-ink); min-height: 100%; }
.app.darkpage { background: var(--panel); }
.app.darkpage .topbar { background: var(--panel); color: var(--panel-ink); }

/* Tab bar */
.tabbar { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; background: var(--tab); display: flex; justify-content: space-around; padding: 10px max(8px, env(safe-area-inset-left, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-right, 0px)); z-index: 20; }
.tabbar button { display: flex; flex-direction: column; align-items: center; gap: 3px; color: #B9CBBF; font-size: 11px; font-weight: 600; min-width: 64px; padding: 4px 0; }
.tabbar button.on { color: #F2C462; font-weight: 800; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--sbar, var(--page)); transition: background 0.3s; }

/* Ride it out */
.ride-ring { position: relative; width: 240px; height: 240px; margin: 8px auto 0; }
.ride-ring svg { position: absolute; inset: 0; }
.breath { position: absolute; left: 50%; top: 50%; width: 150px; height: 150px; margin: -75px 0 0 -75px; border-radius: 50%; background: radial-gradient(circle, rgba(94,140,118,0.9), rgba(76,120,100,0.4)); animation: breathe 14s ease-in-out infinite; }
@keyframes breathe { 0% { transform: scale(0.7); } 28.5% { transform: scale(1); } 57% { transform: scale(1); } 100% { transform: scale(0.7); } }
@media (prefers-reduced-motion: reduce) { .breath { animation: none; transform: scale(0.85); } }
.ride-center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ride-center .time { font-size: 40px; font-weight: 800; letter-spacing: -1px; font-variant-numeric: tabular-nums; }

.timeline { display: flex; flex-direction: column; gap: 0; }
.tl { display: flex; gap: 12px; padding: 8px 0; }
.tl .dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--line); flex-shrink: 0; display: flex; align-items: center; justify-content: center; margin-top: 1px; }
.tl.done .dot { background: var(--deep); border-color: var(--deep); color: #FFFFFF; }
.tl.next .dot { border-color: var(--wattle); border-width: 3px; }

.list-row { display: flex; gap: 12px; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--line); }
.list-row:last-child { border-bottom: 0; }
.toggle { width: 50px; height: 30px; border-radius: 999px; background: var(--line); position: relative; flex-shrink: 0; transition: background .2s; }
.toggle::after { content: ""; position: absolute; left: 3px; top: 3px; width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF; transition: left .2s; }
.toggle.on { background: var(--deep); }
.toggle.on::after { left: 23px; }

.note { border-left: 3px solid var(--sage); padding: 4px 0 4px 12px; }
.safety { border-radius: 18px; padding: 14px 16px; background: var(--tint); }
.safety.strong { background: var(--plus); }
.copy { font-weight: 800; user-select: all; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(100px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--page); padding: 10px 16px; border-radius: 999px; font-weight: 600; font-size: 14px; z-index: 50; max-width: calc(100% - 32px); text-align: center; }
.sheet-pad { padding-bottom: 24px; }
.empty { text-align: center; padding: 18px 8px; color: var(--muted); }
details summary { cursor: pointer; font-weight: 800; list-style: none; }
details summary::-webkit-details-marker { display: none; }
@keyframes pl-bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes pl-wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-7deg)}75%{transform:rotate(7deg)}}
@keyframes pl-hop{0%,100%{transform:translateY(0) scale(1)}40%{transform:translateY(-14px) scale(1.04)}}
@keyframes pl-breathe{0%,100%{transform:scale(0.88)}50%{transform:scale(1.1)}}
@keyframes pl-blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(0.1)}}
@keyframes pl-twinkle{0%,100%{opacity:1}50%{opacity:0.35}}
@keyframes pl-drift{0%{transform:translateX(-150px)}100%{transform:translateX(420px)}}
@keyframes pl-in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pl-pop-a{0%{transform:scale(0.92);opacity:0.4}60%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
@keyframes pl-pop-b{0%{transform:scale(0.92);opacity:0.4}60%{transform:scale(1.03)}100%{transform:scale(1);opacity:1}}
@keyframes pl-grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pl-spark{0%{transform:translateY(-58px) scale(0.4);opacity:0}20%{opacity:1}100%{transform:translateY(-122px) scale(1);opacity:0}}
@keyframes pl-fly{0%{transform:translate(-40px,0)}50%{transform:translate(200px,-16px)}100%{transform:translate(440px,6px)}}
@keyframes pl-flapL{0%,100%{transform:rotate(22deg)}50%{transform:rotate(-14deg)}}
@keyframes pl-flapR{0%,100%{transform:rotate(-22deg)}50%{transform:rotate(14deg)}}
@keyframes pl-glow{0%,100%{opacity:0.1;transform:translateY(0)}50%{opacity:1;transform:translateY(-7px)}}
@keyframes pl-rise { from { transform: translateY(70px); opacity: 0.4 } to { transform: none; opacity: 1 } }
/* Sun home: the scene lives outside #app so its transitions survive re-renders. */
#sunscene { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 480px; height: var(--sh, 400px); overflow: hidden; display: none; z-index: 0; color: #2F4F45; transition: height 0.8s cubic-bezier(0.34, 1.2, 0.64, 1), background 0.7s; --so: 0; --co: 0.75; --bo: 1; --fo: 0; }
#sunscene.show { display: block; }
#sunscene.night { color: #F5EFE3; --so: 1; --co: 0.1; --bo: 0; --fo: 1; }
#app { position: relative; z-index: 1; }
body.sunon::before { display: none; }
.app.sunhome { background: transparent; pointer-events: none; padding-top: var(--ph, 372px); padding-bottom: 0; }
.app.sunhome > * { pointer-events: auto; }
.app.sunrest { background: transparent; pointer-events: none; min-height: 0; padding: 0; }
.app.sunrest > * { pointer-events: auto; }
.app.sunhome .panel { margin-top: 0; min-height: calc(100vh - var(--ph, 372px)); padding-top: 4px; padding-bottom: calc(108px + env(safe-area-inset-bottom, 0px)); }
.app.sunhome.notabs .panel { padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px)); }
body.sunon::before { display: block; background: var(--sbar, var(--panel)); opacity: 0; transition: opacity 0.2s; }
body.sunon.scrolled::before { opacity: 1; }
#sunscene.open.nos .ss-btns { display: none; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand span { font-size: 22px; font-weight: 800; letter-spacing: -0.4px; }
.app.sunhome .panel.rise { animation: pl-rise 0.7s cubic-bezier(0.34, 1.2, 0.64, 1); }
.ss-handle { display: flex; justify-content: center; align-items: center; width: 120px; height: 28px; margin: 0 auto 6px; }
.ss-handle span { width: 44px; height: 5px; border-radius: 3px; background: #A9C2A1; }
.ss-stage { position: absolute; left: 0; top: 0; width: 390px; height: 1600px; transform-origin: 0 0; transform: scale(var(--k, 1)) translateY(var(--so-y, 0px)); transition: transform 0.8s cubic-bezier(0.34, 1.2, 0.64, 1); }
.ss-ground { position: absolute; left: 0; top: 0; width: 390px; height: 600px; transform: translateY(var(--gy, 12px)); transition: transform 0.8s cubic-bezier(0.34, 1.2, 0.64, 1); }
.ss-layer { position: absolute; left: -40px; top: 0; width: 470px; height: 600px; pointer-events: none; transition: transform 0.25s ease-out, background 0.7s; }
.ss-under { position: absolute; left: -40px; top: 590px; width: 470px; height: 1200px; }
.ss-sunwrap { position: absolute; left: 135px; top: 136px; width: 120px; height: 120px; transition: transform 0.7s cubic-bezier(0.34, 1.4, 0.64, 1); }
.ss-halo { position: absolute; left: -36px; top: -36px; width: 192px; height: 192px; border-radius: 50%; pointer-events: none; background: #FFFFFF; opacity: 0.3; transition: opacity 0.7s; }
#sunscene.night .ss-halo { opacity: 0.07; }
.ss-sun { position: relative; display: block; width: 120px; height: 120px; padding: 0; border: none; border-radius: 50%; background: #F2C462; cursor: pointer; animation: none; }
.ss-sun > span { position: absolute; }
.ss-hl { left: 14px; top: 8px; width: 62px; height: 62px; border-radius: 50%; background: #F6D07C; }
.ss-rays { left: 0; top: 0; width: 120px; height: 120px; opacity: 0; transform: scale(0.7); transition: opacity 0.4s, transform 0.5s cubic-bezier(0.34, 1.6, 0.64, 1); }
.ss-rays span { position: absolute; left: 56px; top: -34px; width: 8px; height: 20px; border-radius: 4px; background: #F2C462; transform-origin: 4px 94px; }
.ss-cheek { top: 42px; width: 16px; height: 10px; border-radius: 50%; background: #D9893B; opacity: 0; transition: opacity 0.4s; }
.ss-eyes { left: 0; top: 24px; width: 120px; height: 16px; transform: translate(var(--lx, 0px), var(--ly, 0px)); transition: transform 0.15s ease-out; }
.ss-eyes > span { position: absolute; inset: 0; display: none; align-items: center; justify-content: center; gap: 22px; }
.ss-eyes .e-open { display: flex; }
.e-open i { width: 12px; height: 12px; border-radius: 50%; background: #2F4F45; animation: pl-blink 4.5s infinite; }
.e-happy i, .e-closed i { width: 17px; height: 10px; box-sizing: border-box; border: 3.5px solid #2F4F45; }
.e-happy i { border-bottom: none; border-radius: 17px 17px 0 0; }
.e-closed i { border-top: none; border-radius: 0 0 17px 17px; }
.ss-smile { left: 51px; top: 42px; width: 18px; height: 9px; box-sizing: border-box; border: 3.5px solid #2F4F45; border-top: none; border-radius: 0 0 18px 18px; opacity: 0; transition: opacity 0.3s; }
.ss-zzz { position: absolute; left: 262px; top: 122px; font-size: 20px; font-weight: 800; letter-spacing: 0.12em; color: #F5EFE3; display: none; }
#sunscene[data-mood="idle"] .ss-sun { animation: pl-bob 4s ease-in-out infinite; }
#sunscene[data-mood="happy"] .ss-sun { animation: pl-wiggle 0.5s ease-in-out 2; }
#sunscene[data-mood="cheer"] .ss-sun { animation: pl-hop 0.6s ease-in-out 3; }
#sunscene[data-mood="breathe"] .ss-sun { animation: pl-breathe 8s ease-in-out infinite; }
#sunscene[data-mood="happy"] .ss-sunwrap { transform: translateY(-6px); }
#sunscene[data-mood="beam"] .ss-sunwrap, #sunscene[data-mood="cheer"] .ss-sunwrap { transform: translateY(-14px); }
#sunscene[data-mood="care"] .ss-sunwrap { transform: translateY(6px); }
#sunscene[data-mood="calm"] .ss-sunwrap { transform: translateY(-2px); }
#sunscene[data-mood="sleep"] .ss-sunwrap { transform: translateY(18px); }
#sunscene[data-mood="happy"] .ss-cheek, #sunscene[data-mood="beam"] .ss-cheek, #sunscene[data-mood="cheer"] .ss-cheek,
#sunscene[data-mood="happy"] .ss-smile, #sunscene[data-mood="beam"] .ss-smile, #sunscene[data-mood="cheer"] .ss-smile { opacity: 1; }
#sunscene[data-mood="beam"] .ss-rays, #sunscene[data-mood="cheer"] .ss-rays { opacity: 1; transform: scale(1); }
#sunscene[data-mood="happy"] .e-open, #sunscene[data-mood="beam"] .e-open, #sunscene[data-mood="cheer"] .e-open,
